[pytest]
# Fail on unexpected warnings, including warnings during test collection.
# FastAPI 0.128.2 requires Starlette <0.51; Starlette 0.50.0's TestClient
# imports an AnyIO alias deprecated in AnyIO >=4.15 (Starlette issue #3497).
# The allowlist matches exactly one upstream message and one warning category.
# Remove only after a separately tested FastAPI/Starlette compatibility upgrade.
filterwarnings =
    error
    ignore:^The anyio\.abc\.BlockingPortal alias is deprecated, use anyio\.from_thread\.BlockingPortal instead\.$:DeprecationWarning
