name: Diagnostic backend branch coverage

on:
  push:
    branches:
      - audit/coverage-2026-11-03

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install audited dependency snapshot
        run: |
          python -m pip install -r backend/requirements.txt -c backend/constraints-audit-v38.txt
          python -m pip install -c backend/constraints-audit-v38.txt nashpy==0.0.43 pytest-cov==7.0.0
          python -m pip check
      - name: Run full suite with statement and branch instrumentation
        working-directory: backend
        run: |
          python -m pytest -q -W error --cov=. --cov-config=.coveragerc --cov-branch --cov-report=term-missing --cov-report=json:coverage-audit.json --cov-report=xml:coverage-audit.xml
      - name: Summarize instrumented coverage
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          j = json.load(open('coverage-audit.json'))
          t = j['totals']
          print('OVERALL TOTALS:', t)
          print('MODULE BREAKDOWN: filename / statement % / branch % / missed lines / missed branches')
          for path, rec in sorted(j['files'].items()):
              s = rec['summary']
              cb, nb = s.get('covered_branches', 0), s.get('num_branches', 0)
              print(path, f"{s['percent_covered']:.2f}", f"{(100*cb/nb if nb else 100):.2f}", len(rec['missing_lines']), s.get('missing_branches', 0))
          PY
      - name: Upload independent coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: backend-branch-coverage-audit
          path: |
            backend/coverage-audit.json
            backend/coverage-audit.xml
          retention-days: 14
          if-no-files-found: error
