name: Game Theory Lab core verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install audited Python dependency versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -c backend/constraints-audit-v38.txt
          python -m pip install nashpy==0.0.43 pytest-cov==7.0.0
      - name: Compile
        run: python -m compileall -q backend
      - name: Full regression and adversarial test suite
        working-directory: backend
        run: python -m pytest -q -W error
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Temporary until a real npm lockfile can be generated and checked in.
      # No frontend build PASS is claimed from the offline authoring environment.
      - name: Install frontend dependencies (unlocked)
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
