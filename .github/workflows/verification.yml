name: Game Theory Lab core verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install constrained Python dependencies
        run: |
          python -m pip install -r backend/requirements.txt -c backend/constraints-audit-v38.txt
          python -m pip install -c backend/constraints-audit-v38.txt nashpy==0.0.43 pytest-cov==7.0.0
      - name: Verify dependency consistency
        run: |
          python -m pip check
          python -m pip freeze
      - name: Compile source
        run: python -m compileall -q backend
      - name: Full strict-warning suite with statement and branch coverage
        working-directory: backend
        run: |
          python -m pytest -q -W error --cov=. --cov-config=.coveragerc --cov-branch --cov-report=term-missing --cov-report=json:coverage-audit.json --cov-report=xml:coverage-audit.xml --cov-fail-under=99
      - name: Bounded support-pruning differential benchmark
        working-directory: backend
        run: |
          python -c 'import json; from benchmark_support_pruning_v47 import run; print(json.dumps(run(repetitions=1), indent=2))'
      - name: Matched mixed-dominance research benchmark
        working-directory: backend
        run: |
          python -c 'import json; from benchmark_mixed_dominance_v48 import run; print(json.dumps(run(repetitions=2),indent=2))'
      - name: Independent Nashpy comparator smoke benchmark
        working-directory: backend
        run: |
          python -c 'import json; from benchmark_independent_nashpy_v49 import run; print(json.dumps(run(repetitions=2),indent=2))'
      - name: Exact zero-sum minimax reference benchmark
        working-directory: backend
        run: |
          python -c 'import json; from benchmark_exact_minimax_v51 import run; print(json.dumps(run(repetitions=2),indent=2))'
      - name: Matched rational feasibility fast-path benchmark
        working-directory: backend
        run: python benchmark_exact_probe_v55.py --repetitions 3 --seed 55055 --output benchmark_exact_probe_v55_results.json
      - name: Archive v55 matched performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-probe-v55-evidence
          path: backend/benchmark_exact_probe_v55_results.json
          retention-days: 30
          if-no-files-found: warn
      - name: Paired exact feasibility scaling and differential campaign v55
        working-directory: backend
        run: python benchmark_exact_scaling_v55.py --repetitions 3 --seed 55055 --output benchmark_exact_scaling_v55_results.json
      - name: Archive paired scaling evidence v55
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-scaling-v55-evidence
          path: backend/benchmark_exact_scaling_v55_results.json
          retention-days: 30
          if-no-files-found: warn
      - name: Exact sign-screen performance and bit-growth campaign v56
        working-directory: backend
        run: python benchmark_sign_screen_v56.py --repetitions 3 --seed 56056 --output benchmark_sign_screen_v56_results.json
      - name: Archive exact sign-screen v56 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-sign-screen-v56-evidence
          path: backend/benchmark_sign_screen_v56_results.json
          retention-days: 30
          if-no-files-found: error
      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-v40-coverage
          path: |
            backend/coverage-audit.json
            backend/coverage-audit.xml
          retention-days: 14
          if-no-files-found: warn

  external-gambit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install frozen core dependencies and exact Gambit reference
        run: |
          python -m pip install -r backend/requirements.txt -c backend/constraints-audit-v38.txt
          python -m pip install --only-binary=:all: pygambit==17.0.0b2
          python -m pip check
          python -m pip show pygambit
      - name: Test comparator with actual third-party Gambit engine
        working-directory: backend
        run: python -m pytest -q -W error test_benchmark_gambit_v52.py benchmark_gambit_external_validation_v52.py
      - name: Run pinned cross-engine exact-rational campaign
        working-directory: backend
        run: python benchmark_gambit_v52.py --repetitions 3 --seed 52052 --output benchmark_gambit_v52_results.json
      - name: Archive independently validated benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-gambit-v52-evidence
          path: backend/benchmark_gambit_v52_results.json
          retention-days: 30
      - name: Validate independent exact general-sum Nash reference
        working-directory: backend
        run: python -m pytest -q -W error test_gambit_general_contract_v54.py benchmark_gambit_general_external_v54.py
      - name: Execute Gambit extreme-equilibria vs exact H-polytopes
        working-directory: backend
        run: python benchmark_gambit_general_v54.py --repetitions 3 --seed 54054 --output benchmark_gambit_general_v54_results.json
      - name: Archive exact general-sum Nash reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-gambit-general-v54-evidence
          path: backend/benchmark_gambit_general_v54_results.json
          retention-days: 30
          if-no-files-found: warn

  external-openspiel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned OpenSpiel numerical reference and LP backend
        run: |
          python -m pip install --only-binary=:all: open-spiel==2.0.2 cvxpy==1.9.3 ecos==2.0.14 numpy==2.3.5 scipy==1.17.0 pytest==9.0.2
          python -m pip check
          python -m pip show open-spiel cvxpy ecos
      - name: Verify actual OpenSpiel LP and adversarial comparator contracts
        working-directory: backend
        run: python -m pytest -q test_open_spiel_contract_v53.py benchmark_open_spiel_external_validation_v53.py
      - name: Execute reproducible OpenSpiel comparison
        working-directory: backend
        run: python benchmark_openspiel_v53.py --repetitions 5 --seed 53053 --output benchmark_openspiel_v53_results.json
      - name: Archive OpenSpiel comparator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-openspiel-v53-evidence
          path: backend/benchmark_openspiel_v53_results.json
          retention-days: 30
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
