name: Game Theory Lab core verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install constrained Python dependencies
        run: |
          python -m pip install -r backend/requirements.txt -c backend/constraints-audit-v38.txt
          python -m pip install nashpy==0.0.43 pytest-cov==7.0.0
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile source
        run: python -m compileall -q backend
      - name: Full strict-warning regression and adversarial suite
        working-directory: backend
        # pytest.ini enables warnings-as-errors while excluding exactly one
        # documented upstream Starlette/AnyIO deprecation during collection.
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies (temporary until lockfile is committed)
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Export resolved npm lockfile for reproducible follow-up
        uses: actions/upload-artifact@v4
        with:
          name: game-theory-frontend-lockfile
          path: frontend/package-lock.json
          retention-days: 3
          if-no-files-found: error
      - name: Emit resolved lockfile for GitHub import (temporary)
        working-directory: frontend
        run: |
          echo GTL_LOCK_BEGIN_v38
          cat package-lock.json
          echo GTL_LOCK_END_v38
      - name: Build frontend
        working-directory: frontend
        run: npm run build
